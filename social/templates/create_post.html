<!DOCTYPE html>
<html>
<head>
    <title>Create Post - ConnectHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        nav {
            background: #1877f2;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #1877f2;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0d65d9;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1877f2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <h1>ConnectHub</h1>

    <div>
        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'profile' user.username %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h2>📝 Create New Post</h2>

        <form method="POST">

            {% csrf_token %}

            <textarea
                name="content"
                placeholder="What's on your mind?"
                required></textarea>

            <input
                type="url"
                name="image"
                placeholder="Optional image URL">

            <button type="submit">
                🚀 Publish Post
            </button>

        </form>

        <div class="back">
            <a href="{% url 'home' %}">
                ← Back to Home
            </a>
        </div>

    </div>

</div>

</body>
</html>
